<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarMechForge sounds</title>
<style>
:root{--bg:#14110f;--fg:#e8dfd0;--mut:#9a8f80;--card:#201b17;--line:#3a322a;--acc:#d9a441}
@media (prefers-color-scheme:light){:root{--bg:#f4efe6;--fg:#241d16;--mut:#6b6054;--card:#fffaf0;--line:#d8cdb8;--acc:#9a6a10}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:4px}
h3{font-size:13px;margin:14px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
p.n{color:var(--mut);margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0}
.row button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);background:none;color:var(--acc);cursor:pointer;font-size:14px}
.row.playing button{background:var(--acc);color:var(--bg)}
.row .t{min-width:0;flex:1}.row b{display:block;font-weight:600;overflow-wrap:anywhere}.row small{color:var(--mut);display:block}
.row.missing{opacity:.5}.row.missing button{cursor:not-allowed}
.tag{flex:none;font-size:11px;color:var(--mut)}
</style></head><body>

<p class="n">One clip plays at a time. Faded rows are not generated yet (music is generated later). The bold id is the name to give me for a redo.</p>

ginal heat warning alarm: a repeating two-tone electronic beep-beep alert, pitched urgent and steady, clean synthesized tones, no music, no voices","dur":1.5,"loop":false},{"id":"ht-shutdown","kind":"sfx","group":"heat","note":"A giant machine reactor shutting down: a descending power-down whine falling in pitch, fans spinning down, a final heavy clunk of dying systems, no music, no voices","dur":2,"loop":false},{"id":"ht-startup","kind":"sfx","group":"heat","note":"A giant machine reactor starting up: a rising power-up whine, relays clicking, fans spinning up and a final low hum settling, no music, no voices","dur":2,"loop":false},{"id":"ht-vent","kind":"sfx","group":"heat","note":"Coolant venting from a machine: a long steady hiss of pressurised coolant gas escaping with a soft metal rattle at the start, no music, no voices","dur":1.5,"loop":false},{"id":"ui-click","kind":"sfx","group":"ui","note":"A single crisp mechanical button click, a short dry tactile switch snap, no music, no voices","dur":0.5,"loop":false},{"id":"ui-dice","kind":"sfx","group":"ui","note":"Two wooden dice rattling and rolling across a hard table and settling, short tumbling clatter, no music, no voices","dur":1.2,"loop":false},{"id":"ui-turn-bell","kind":"sfx","group":"ui","note":"A single clear brass bell strike with a ringing metallic decay, a soft ceremonial chime, no music, no voices","dur":1.5,"loop":false},{"id":"nar-initiative","kind":"voice","group":"narrator","note":"Initiative","loop":false,"voice":"narrator"},{"id":"nar-movement","kind":"voice","group":"narrator","note":"Movement phase","loop":false,"voice":"narrator"},{"id":"nar-ranged","kind":"voice","group":"narrator","note":"Ranged attacks","loop":false,"voice":"narrator"},{"id":"nar-physical","kind":"voice","group":"narrator","note":"Physical attacks","loop":false,"voice":"narrator"},{"id":"nar-heat","kind":"voice","group":"narrator","note":"Heat phase","loop":false,"voice":"narrator"},{"id":"nar-critical","kind":"voice","gr var cur=null,curRow=null;
function path(i){return i.kind==='music'?'audio/music/'+i.id+'.mp3':'audio/'+i.id+'.mp3'}
function stop(){if(cur){cur.pause();cur.currentTime=0}if(curRow)curRow.classList.remove('playing');cur=null;curRow=null}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
var root=document.getElementById('root');
[['sfx','Sound effects'],['voice','Voice lines (narrator and cockpit computer)'],['music','Music (candidates -a / -b)']].forEach(function(s){
  var h=el('h2','',s[1]);root.appendChild(h);var last='';
  ITEMS.filter(function(i){return i.kind===s[0]}).forEach(function(i){
    if(i.group!==last){root.appendChild(el('h3','',i.group));last=i.group}
    var row=el('div','row'),b=el('button','','▶'),t=el('div','t'),n=el('b','',i.id),d=el('small','',(i.voice?'['+i.voice+'] ':'')+i.note);

    if(i.dur)row.appendChild(el('span','tag',i.dur+' s'+(i.loop?' loop':'')));

    b.onclick=function(){if(cur===a){stop();return}stop();cur=a;curRow=row;row.classList.add('playing');a.currentTime=0;a.play().catch(function(){row.classList.add('missing');stop()})};
